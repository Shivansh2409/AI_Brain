services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - backend/.env
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
