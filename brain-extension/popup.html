<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>

    <main class="container">
      <!-- Header -->
      <header class="header">
        <div class="brand">
          <div class="logo">
            <!-- brain icon -->
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" />
              <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z" />
              <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4" />
              <path d="M17.599 6.5a3 3 0 0 0 .399-1.375" />
              <path d="M6.003 5.125A3 3 0 0 0 6.401 6.5" />
              <path d="M3.477 10.896a4 4 0 0 1 .585-.396" />
              <path d="M19.938 10.5a4 4 0 0 1 .585.396" />
              <path d="M6 18a4 4 0 0 1-1.967-.516" />
              <path d="M19.967 17.484A4 4 0 0 1 18 18" />
            </svg>
          </div>
          <div>
            <h1 class="title">AI Brain</h1>
            <p class="subtitle">Save to your second brain</p>
          </div>
        </div>
        <span id="auth-state" class="auth-state checking">
          <span class="dot"></span><span id="auth-text">Checking…</span>
        </span>
      </header>

      <!-- Current page -->
      <section class="page-card" aria-label="Page to save">
        <div class="favicon-wrap">
          <img id="page-favicon" alt="" hidden />
          <svg id="page-globe" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
            <path d="M2 12h20" />
          </svg>
        </div>
        <div class="page-info">
          <p id="page-title" class="page-title">Loading page…</p>
          <p class="page-meta">
            <span id="page-type" class="type-badge"><span class="type-dot"></span><span id="page-type-label">Article</span></span>
            <span id="page-host" class="page-host"></span>
          </p>
        </div>
      </section>

      <!-- Reason -->
      <section class="field">
        <label class="label">Why are you saving this?</label>
        <div class="reason-pills" id="reason-container">
          <button class="pill active" data-reason="Read Later">Read Later</button>
          <button class="pill" data-reason="Research">Research</button>
          <button class="pill" data-reason="Inspiration">Inspiration</button>
          <button class="pill" data-reason="Code Reference">Code Reference</button>
          <button class="pill" data-reason="Hackathon Idea">Hackathon Idea</button>
          <button class="pill" data-reason="YouTube Content">YouTube Content</button>
        </div>
      </section>

      <!-- Note -->
      <section class="field">
        <label class="label" for="user-note">Note <span class="optional">optional</span></label>
        <textarea
          id="user-note"
          class="note-input"
          placeholder="What should future-you remember about this?"
          rows="3"
        ></textarea>
      </section>

      <!-- Save -->
      <button id="save-btn" class="btn-primary">
        <span class="spinner" aria-hidden="true"></span>
        <svg id="btn-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12" />
          <path d="m7 10 5 5 5-5" />
          <path d="M5 21h14" />
        </svg>
        <svg class="check-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5" />
        </svg>
        <span id="btn-text">Save to Brain</span>
        <kbd class="kbd" id="kbd-hint">⌘ Enter</kbd>
      </button>

      <p id="status-msg" class="status hidden" role="status"></p>

      <footer class="footer">
        <a href="http://localhost:3000" target="_blank" class="dashboard-link">
          Open dashboard
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 17 17 7" />
            <path d="M7 7h10v10" />
          </svg>
        </a>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
